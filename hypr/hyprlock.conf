
# ==========================================
#             HYPRLOCK CONFIG
# ==========================================

$font = JetBrains Mono Nerd Font
$accent = rgba(89b4faff)
$foreground = rgba(cdd6f4ff)
$background = rgba(1e1e2eff)

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
    disable_loading_bar = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.05
}

# ------------------------------------------
#              CLOCK
# ------------------------------------------

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $foreground
    font_size = 110
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

# ------------------------------------------
#               DATE
# ------------------------------------------

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = $accent
    font_size = 20
    font_family = $font
    position = 0, 35
    halign = center
    valign = center
}

# ------------------------------------------
#            USERNAME
# ------------------------------------------

label {
    monitor =
    text = $USER
    color = $foreground
    font_size = 14
    font_family = $font
    position = 0, -80
    halign = center
    valign = center
}

# ------------------------------------------
#           PASSWORD INPUT
# ------------------------------------------

input-field {
    monitor =
    size = 300, 55
    outline_thickness = 2
    dots_size = 0.20
    dots_spacing = 0.10
    dots_center = true

    outer_color = $accent
    inner_color = $background
    font_color = $foreground
    check_color = $accent
    fail_color = rgba(f38ba8ff)

    fade_on_empty = false
		placeholder_text = <span foreground="##cdd6f4">Enter password...</span>
    fail_text = <span foreground="##f38ba8">Incorrect password</span>

    font_family = $font
    font_size = 14

    position = 0, -160
    halign = center
    valign = center
}

