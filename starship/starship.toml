format = '$directory$character'

add_newline = true

# =========================================
# DIRECTORY CONFIGURATION
# =========================================
[directory]
truncation_length = 0
read_only = ''
style = 'bold ##89B4FA'

# =========================================
# CHARACTER CONFIGURATION
# =========================================
[character]
disabled = false
success_symbol = "[❯](bold #A6E3A1)"
error_symbol = "[❯](bold #F18AA7)"

